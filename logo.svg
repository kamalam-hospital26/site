<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0AA6A6"/>
      <stop offset="100%" stop-color="#073F46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0CB33"/>
      <stop offset="100%" stop-color="#F8B276"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31E27"/>
      <stop offset="100%" stop-color="#B71620"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#073F46" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Circle Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#tealGrad)" stroke-width="8" opacity="0.2"/>
  <circle cx="250" cy="250" r="205" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- Lotus Petals (Kamalam) -->
  <!-- Top Center Petal -->
  <path d="M250 85 C222 140 215 185 250 235 C285 185 278 140 250 85 Z" fill="url(#tealGrad)"/>
  <!-- Left Main Petal -->
  <path d="M250 235 C190 205 130 195 110 245 C160 265 210 255 250 235 Z" fill="url(#tealGrad)" opacity="0.88"/>
  <!-- Right Main Petal -->
  <path d="M250 235 C310 205 370 195 390 245 C340 265 290 255 250 235 Z" fill="url(#tealGrad)" opacity="0.88"/>
  <!-- Inner Gold Left Petal -->
  <path d="M250 235 C200 165 160 135 160 195 C190 225 220 235 250 235 Z" fill="url(#goldGrad)"/>
  <!-- Inner Gold Right Petal -->
  <path d="M250 235 C300 165 340 135 340 195 C310 225 280 235 250 235 Z" fill="url(#goldGrad)"/>

  <!-- Base Lotus Bowl -->
  <path d="M160 300 C200 335 300 335 340 300 C310 320 190 320 160 300 Z" fill="url(#tealGrad)"/>
  
  <!-- Red Emergency Medical Cross at Center -->
  <g transform="translate(250, 235) scale(1.15)">
    <rect x="-14" y="-45" width="28" height="90" rx="6" fill="url(#redGrad)"/>
    <rect x="-45" y="-14" width="90" height="28" rx="6" fill="url(#redGrad)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="url(#redGrad)"/>
  </g>
</svg>
